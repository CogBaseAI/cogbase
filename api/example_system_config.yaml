# CogBase system configuration
#
# Place this file at ./cogbase_system.yaml or point to it with:
#   COGBASE_CONFIG=/path/to/cogbase_system.yaml
#
# All fields are optional.  When omitted, in-memory stores are used and
# data is lost when the service restarts.

# How the calling account is resolved.
#   saas          -> account comes from a verified access token; requires
#                    COGBASE_JWT_SECRET (enforced at startup). This is the
#                    fail-secure default when this key is omitted.
#   dev           -> account is trust-on-declaration via the X-Account-Id header
#                    (no token needed). Use for local development and tests.
#   single_tenant -> also trust-on-declaration for now.
deployment_mode: dev

# HMAC secret used to sign and verify access tokens. Must be identical on every
# node. Required in saas mode (the service refuses to start without it); omit it
# in dev mode to use an insecure built-in development secret.
#
# Prefer the COGBASE_JWT_SECRET env var over this YAML field for anything but
# local dev: the env var is read once at startup and deleted from the process
# environment before any request is served, so a tenant-triggered subprocess
# (run_python/shell) has nothing to inherit even if the allowlist ever widened
# by mistake. A value set here stays in the process environment/on disk for the
# life of the container. Same reasoning applies to llm.api_key /
# embedding.api_key below — prefer COGBASE_LLM_API_KEY / COGBASE_EMBEDDING_API_KEY.
# jwt_secret: change-me-to-a-long-random-string

# Whether an authenticated account may upload/replace/delete its own skills via
# POST/PUT/DELETE /skills. Defaults to false — a tenant-uploaded skill can
# declare arbitrary pip installs, so the safe configuration is the one you get
# by not thinking about it. Only set this if this deployment genuinely wants
# tenant-uploaded skills.
# tenant_skill_upload: false

# Whether PATCH /system/config may live-patch the system LLM/embedding config.
# Defaults to false: the route has no authentication of its own, so a managed
# deployment leaves it closed and edits this file (then restarts) instead.
# system_config_writable: false

# Store backend for the application registry (CogBase's own metadata).
# Supports the same backends as application stores: sqlite, postgres, or memory.
# When absent, falls back to the COGBASE_SYSTEM_DB env var (SQLite path) or
# ./cogbase_system.db.
system_db:
  type: sqlite                       # sqlite | postgres | memory
  path: ./data/cogbase_system.db     # required for sqlite
  # type: postgres
  # url: postgresql://user:pass@localhost:5432/cogbase   # required for postgres

# Shared structured store — all applications write their collections here.
# Each application gets its own namespace (prefix) so collections never
# collide, even when multiple applications share this backend.
structured_store:
  type: sqlite                  # sqlite | postgres | memory
  path: ./data/cogbase.db       # required for sqlite
  # type: postgres
  # url: postgresql://user:pass@localhost:5432/cogbase   # required for postgres

# Vector store settings — a fresh instance of this type is created for each
# application that has embedding + chunker configured.
# Remove this section to run all applications in structured-only mode.
vector_store:
  type: faiss                   # faiss | pgvector
  path: ./data/faiss_vector_store # optional for faiss; defaults to a temp directory
  # type: pgvector
  # url: postgresql://user:pass@localhost:5432/cogbase   # required for pgvector

# Default document store settings for storing full document text by doc_id.
# Use this when applications do not provide their own document_store config.
document_store:
  type: local                   # local | s3
  path: ./data/documents        # required for local
  # type: s3
  # bucket: my-cogbase-docs     # required for s3
  # prefix: app-documents       # optional
  # region: us-west-2           # optional

# Append-only log store backing episodic memory (per-session event logs).
# Remove this section to run without durable episodic memory.
log_store:
  type: local                   # local | s3
  path: ./data/logs             # required for local
  # type: s3
  # bucket: my-cogbase-logs     # required for s3 (directory bucket)
  # prefix: app-logs            # optional
  # region: us-west-2           # optional

# Built-in ("default") skills shipped with CogBase, loaded on startup as
# read-only skills and surfaced in the UI Skills tab. Required for the account
# onboarding interview: its script *is* a skill
# (skills/account-onboarding-interview-legal), so POST /profile/interview/chat
# returns 503 when no skills_dir is configured. Point it at the repo's skills/.
skills_dir: ./skills

llm:
  provider: openai           # "openai" | "openai-compatible"
  model: gpt-5.4-mini
  mini_model: gpt-5.4-mini
  api_key: sk-xxx

  # OpenAI-compatible providers (vLLM, Alibaba DashScope, etc.):
  # provider: openai-compatible
  # model: gpt-5.4-mini
  # mini_model: gpt-5.4-mini
  # base_url: http://localhost:8000/v1          # vLLM
  # base_url: https://dashscope.aliyuncs.com/compatible-mode/v1  # Alibaba
  # api_key: sk-xxx

embedding:                   # shared across all vector and summarize collections
  provider: openai           # "openai" | "openai-compatible" | "sentence-transformers"
  model: text-embedding-3-small
  dimensions: 1536
  api_key: sk-xxx

  # OpenAI-compatible embedding providers (vLLM, Alibaba DashScope, etc.):
  # provider: openai-compatible
  # model: text-embedding-v3
  # dimensions: 1536
  # base_url: http://localhost:8000/v1                              # vLLM
  # base_url: https://dashscope.aliyuncs.com/compatible-mode/v1   # Alibaba
  # api_key: sk-xxx

# Contract Analyst — CogBase app config
#
# Bundle structure:
#   contract_analyst.zip
#   ├── config.yaml                       (this file)
#   ├── contracts_record_schema.json      (record schema — includes doc_id)
#   ├── contracts_extraction_schema.json  (LLM extraction schema — no identity fields)
#   └── contracts_prompt.txt              (LLM system prompt)

name: contract-analyst

# Starter prompts shown in the Query tab's empty state. The first two are
# cross-document reasoning; the third exercises the legal-review skill (redline).
query_intro: >-
  Ask across the contract portfolio, or have a single contract reviewed clause
  by clause and returned as a tracked-changes redline.
example_queries:
  - review the saas-002 contract on behalf of the customer, disadvantaged position
  - which contracts expire before 2026-01-01?
  - we have multiple agreements with TechVault Solutions — do their payment terms conflict?
  - which agreements have unlimited liability or no stated liability cap?

# Clause-by-clause redline review of an uploaded .docx contract. Loaded as a
# built-in skill from the system skills_dir (see the deployment's
# cogbase_system.yaml); referenced by id so the query runner can route a
# "review this contract" request to it.
skills:
  - legal-review
  - edit-docx

vector_collections:
  - name: contract_chunks
    description: >-
      Full-text passage index across all contract documents.

structured_collections:
  - name: contracts
    description: >-
      Extracted contract facts and entities from each contract.
    schema: contracts_record_schema.json
    primary_fields: [doc_id]

pipelines:
  - name: contracts
    routing_description: >-
      Any contract document — vendor agreements, service contracts, NDAs, or
      similar legal agreements to be analyzed for key facts and entities.
    steps:
      - tool: chunk-embed-upsert
        collection: contract_chunks

      - tool: extract-structured
        collection: contracts
        extractor:
          type: llm
          extraction_schema: contracts_extraction_schema.json
          prompt: contracts_prompt.txt
